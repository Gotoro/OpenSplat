name: OpenSplat Windows CUDA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Windows CUDA 12.8
    runs-on: windows-2022

    env:
      CCACHE_DIR: ${{ github.workspace }}\ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CL: /MP
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Install ccache
          Invoke-WebRequest `
            -Uri "https://github.com/ccache/ccache/releases/download/v4.9.1/ccache-4.9.1-windows-x86_64.zip" `
            -OutFile "ccache.zip"

          Expand-Archive `
            -Path ".\ccache.zip" `
            -DestinationPath "${{ github.workspace }}"

          Remove-Item ".\ccache.zip" -Force

          "${{ github.workspace }}\ccache-4.9.1-windows-x86_64" |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          # Install OpenCV
          Invoke-WebRequest `
            -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" `
            -OutFile "opencv.exe"

          Start-Process `
            -Wait `
            -FilePath ".\opencv.exe" `
            -ArgumentList "-oopencv -y"

          Remove-Item ".\opencv.exe" -Force

          if (!(Test-Path ".\OpenCV\opencv\build\OpenCVConfig.cmake")) {
            throw "OpenCV installation failed."
          }

      - name: Restore CUDA Cache
        uses: actions/cache@v4
        id: cuda-cache
        with:
          key: cuda-12.8.0-windows
          path: |
            C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA*
            C:\Program Files\NVIDIA Corporation\NvToolsExt

      - name: Install CUDA
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          .github/workflows/cuda/Windows.ps1 12.8.0

      - name: Setup CUDA
        shell: bash
        run: |
          CUDA_VER="12.8"
          CUDA_VER_ID="12_8"
          CUDA_VER_SHORT="cu128"
          CUDA_PATH_WIN="C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v${CUDA_VER}"

          echo "CUDA_VER_SHORT=${CUDA_VER_SHORT}" >> "${GITHUB_ENV}"
          echo "CUDA_PATH=${CUDA_PATH_WIN}" >> "${GITHUB_ENV}"
          echo "CUDA_PATH_V${CUDA_VER_ID}=${CUDA_PATH_WIN}" >> "${GITHUB_ENV}"
          echo "CUDA_PATH_VX_Y=CUDA_PATH_V${CUDA_VER_ID}" >> "${GITHUB_ENV}"
          echo "CudaToolkitDir=${CUDA_PATH_WIN}" >> "${GITHUB_ENV}"
          echo "${CUDA_PATH_WIN}\\bin" >> "${GITHUB_PATH}"

          # Ensure CUDA is available to Visual Studio/MSBuild.
          if [[ -d "${CUDA_PATH_WIN}\\extras\\visual_studio_integration\\MSBuildExtensions" ]]; then
            cp -R \
              "${CUDA_PATH_WIN}\\extras\\visual_studio_integration\\MSBuildExtensions\\." \
              "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise\\MSBuild\\Microsoft\\VC\\v170\\BuildCustomizations"
          fi

      - name: Verify CUDA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          $nvcc = "$cuda\bin\nvcc.exe"

          if (!(Test-Path $nvcc)) {
            throw "nvcc not found: $nvcc"
          }

          Write-Host "CUDA installation:"
          & $nvcc --version

          Write-Host ""
          Write-Host "Supported GPU code:"
          & $nvcc --list-gpu-code

      - name: Restore LibTorch Cache
        uses: actions/cache@v4
        id: libtorch-cache
        with:
          key: libtorch-2.7.0-cu128-windows
          path: |
            ${{ github.workspace }}\libtorch

      - name: Install LibTorch
        if: steps.libtorch-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://download.pytorch.org/libtorch/cu128/libtorch-win-shared-with-deps-2.7.0%2Bcu128.zip"

          Write-Host "Downloading:"
          Write-Host $url

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "libtorch.zip"

          Write-Host "Extracting LibTorch..."

          Expand-Archive `
            -Path ".\libtorch.zip" `
            -DestinationPath "${{ github.workspace }}"

          Remove-Item ".\libtorch.zip" -Force

          if (!(Test-Path ".\libtorch\include")) {
            throw "LibTorch installation failed."
          }

      - name: Cache Compiler
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-cuda-12.8-torch-2.7.0-${{ github.sha }}
          restore-keys: |
            windows-cuda-12.8-torch-2.7.0-

      - name: Configure
        shell: pwsh
        env:
          CudaToolkitDir: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
          CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\libtorch" `
            -DOPENCV_DIR="${{ github.workspace }}\OpenCV\opencv\build" `
            -DCUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" `
            -DGPU_RUNTIME=CUDA `
            -DOPENSPLAT_BUILD_SIMPLE_TRAINER=ON

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Verify Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for executables..."

          Get-ChildItem `
            -Path ".\build" `
            -Filter "*.exe" `
            -Recurse |
            Select-Object FullName, Length

          $opensplat = Get-ChildItem `
            -Path ".\build" `
            -Filter "opensplat.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$opensplat) {
            throw "opensplat.exe was not produced."
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $opensplat.FullName

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "package" |
            Out-Null

          # Main executable
          $opensplat = Get-ChildItem `
            -Path ".\build" `
            -Filter "opensplat.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$opensplat) {
            throw "opensplat.exe not found."
          }

          Copy-Item `
            $opensplat.FullName `
            ".\package\opensplat.exe"

          # OpenCV runtime
          $opencv = Get-ChildItem `
            -Path ".\OpenCV" `
            -Filter "opencv_world4100.dll" `
            -Recurse |
            Select-Object -First 1

          if (!$opencv) {
            throw "opencv_world4100.dll not found."
          }

          Copy-Item `
            $opencv.FullName `
            ".\package\"

          # LibTorch runtime DLLs
          $torchDlls = @(
            "c10.dll",
            "c10_cuda.dll",
            "torch.dll",
            "torch_cpu.dll",
            "torch_cuda.dll"
          )

          foreach ($dll in $torchDlls) {
            $source = Join-Path "${{ github.workspace }}\libtorch\lib" $dll

            if (Test-Path $source) {
              Copy-Item `
                $source `
                ".\package\" `
                -Force
            }
          }

          # CUDA runtime DLLs
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin"

          $cudaDlls = @(
            "cudart64_12.dll",
            "cublas64_12.dll",
            "cublasLt64_12.dll"
          )

          foreach ($dll in $cudaDlls) {
            $source = Join-Path $cudaBin $dll

            if (Test-Path $source) {
              Copy-Item `
                $source `
                ".\package\" `
                -Force
            }
          }

          Write-Host ""
          Write-Host "Package contents:"
          Get-ChildItem ".\package" |
            Select-Object Name,
              @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}}

          Compress-Archive `
            -Path ".\package\*" `
            -DestinationPath "opensplat-windows-x64.zip" `
            -Force

          Write-Host ""
          Write-Host "Final ZIP:"
          Get-Item "opensplat-windows-x64.zip" |
            Select-Object Name,
              @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}}

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: opensplat-windows-x64
          path: opensplat-windows-x64.zip
          retention-days: 30

      - name: Compiler Cache Stats
        shell: pwsh
        run: |
          ccache --show-stats