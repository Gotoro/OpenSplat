name: Build OpenSplat for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenCV
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Invoke-WebRequest `
            -Uri "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-windows.exe" `
            -OutFile "opencv.exe"

          Start-Process `
            -Wait `
            -FilePath ".\opencv.exe" `
            -ArgumentList "-oopencv -y"

          Remove-Item ".\opencv.exe" -Force

          if (!(Test-Path ".\OpenCV\opencv\build\OpenCVConfig.cmake")) {
            throw "OpenCV installation failed."
          }

      - name: Install CUDA 12.4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          .github/workflows/cuda/Windows.ps1 12.4.0

      - name: Configure CUDA environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4"

          if (!(Test-Path "$cuda\bin\nvcc.exe")) {
            throw "CUDA 12.4 was not installed."
          }

          "CUDA_PATH=$cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V12_4=$cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_VX_Y=CUDA_PATH_V12_4" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CudaToolkitDir=$cuda" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "$cuda\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          $vsExtensions = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\BuildCustomizations"

          if (Test-Path "$cuda\extras\visual_studio_integration\MSBuildExtensions") {
            Copy-Item `
              "$cuda\extras\visual_studio_integration\MSBuildExtensions\*" `
              $vsExtensions `
              -Recurse `
              -Force
          }

          & "$cuda\bin\nvcc.exe" --version

      - name: Install LibTorch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://download.pytorch.org/libtorch/nightly/cu124/libtorch-win-shared-with-deps-latest.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "libtorch.zip"

          Expand-Archive `
            -Path "libtorch.zip" `
            -DestinationPath "${{ github.workspace }}"

          Remove-Item "libtorch.zip" -Force

          if (!(Test-Path ".\libtorch\include")) {
            throw "LibTorch installation failed."
          }

      - name: Configure
        shell: pwsh
        env:
          CudaToolkitDir: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\libtorch" `
            -DOPENCV_DIR="${{ github.workspace }}\OpenCV\opencv\build" `
            -DCUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4" `
            -DGPU_RUNTIME=CUDA `
            -DOPENSPLAT_BUILD_SIMPLE_TRAINER=ON

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null

          $exe = Get-ChildItem `
            -Path build `
            -Filter "opensplat.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$exe) {
            throw "opensplat.exe was not produced."
          }

          Copy-Item $exe.FullName "package\opensplat.exe"

          # OpenCV
          $opencvDll = "OpenCV\opencv\build\x64\vc16\bin\opencv_world4100.dll"

          if (!(Test-Path $opencvDll)) {
            throw "Missing OpenCV DLL: $opencvDll"
          }

          Copy-Item $opencvDll "package\"

          # CUDA runtime DLLs
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"

          $cudaDlls = @(
            "cudart64_12.dll",
            "cublas64_12.dll",
            "cublasLt64_12.dll"
          )

          foreach ($dll in $cudaDlls) {
            $source = Join-Path $cudaBin $dll

            if (Test-Path $source) {
              Copy-Item $source "package\"
            }
          }

          # Only copy the LibTorch DLLs required by the executable.
          # Start with the main Torch/C10 libraries.
          $torchDlls = @(
            "torch.dll",
            "torch_cpu.dll",
            "c10.dll",
            "c10_cuda.dll",
            "torch_cuda.dll"
          )

          foreach ($dll in $torchDlls) {
            $source = Join-Path "${{ github.workspace }}\libtorch\lib" $dll

            if (Test-Path $source) {
              Copy-Item $source "package\"
            }
          }

          Write-Host ""
          Write-Host "Package contents:"
          Get-ChildItem package |
            Select-Object Name, @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}}

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "opensplat-windows-x64.zip" `
            -Force

          Write-Host ""
          Write-Host "ZIP size:"
          Get-Item "opensplat-windows-x64.zip" |
            Select-Object Name, @{Name="MB";Expression={[math]::Round($_.Length / 1MB, 2)}}
                  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensplat-windows-x64
          path: opensplat-windows-x64.zip
          retention-days: 30